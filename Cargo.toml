[package]
name = "x302-cn"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "x302-cn"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "compression-gzip",
    "compression-deflate",
    "cors",
    "trace",
    "request-id",
    "set-header",
    "propagate-header",
] }

sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }

minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

once_cell = "1"
thiserror = "2"
url = "2"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
